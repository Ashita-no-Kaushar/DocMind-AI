[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
    ".venv",
    ".git",
    ".ruff_cache",
    ".index_cache",
    "__pycache__",
    "data",
    "eval_report.md",
    "eval_results.json",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "F63",
    "F7",
    "F82",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PIE",
    "RUF005",
    "RUF012",
    "RUF013",
    "RUF019",
    "RUF022",
    "RUF046",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '(^|/)(\.venv|\.git|\.ruff_cache|\.index_cache|__pycache__|data)(/|$)|/(eval_report\.md|eval_results\.json)$'
