name: E2E Browser and Integration

"on":
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPENV_NOSPIN: "1"
  PIPENV_VERSION: "2026.8.0"
  PIPENV_VENV_IN_PROJECT: "1"

jobs:
  e2e:
    name: Browser and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.15"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "pipenv==${PIPENV_VERSION}"
          pipenv verify
          pipenv install --deploy --dev --extra-pip-args="--require-hashes"

      - name: Install Chromium and its system dependencies
        run: pipenv run python -m playwright install --with-deps chromium

      - name: Run browser and integration tests
        run: pipenv run python -m unittest tests.test_e2e_integration
