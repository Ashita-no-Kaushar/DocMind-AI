name: Quality

"on":
  pull_request:
  push:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPENV_NOSPIN: "1"
  PIPENV_VERSION: "2026.8.0"
  PIPENV_VENV_IN_PROJECT: "1"

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13.15"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check "pipenv==${PIPENV_VERSION}"
          pipenv verify
          pipenv install --deploy --dev --extra-pip-args="--require-hashes"

      - name: Run unit tests
        run: pipenv run python -m unittest discover -s tests

      - name: Compile application and tests
        run: pipenv run python -m compileall -q main.py components utils research eval_harness.py tests

      - name: Check installed dependencies
        run: pipenv run python -m pip check

      - name: Run Ruff checks
        run: pipenv run ruff check .

      - name: Check Black formatting
        run: pipenv run black --check .

      - name: Run mock evaluation
        run: pipenv run python eval_harness.py --mock

      - name: Check retrieval-map ablation artifacts are current
        run: pipenv run python -m research.map_ablation --check
